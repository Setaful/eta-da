name: NTE bot
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: nte-bot
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start RSSHub (для Bilibili и Weibo)
        run: |
          docker run -d --name rsshub -p 1200:1200 diygod/rsshub:chromium-bundled
          for i in $(seq 1 40); do curl -sf http://localhost:1200/ >/dev/null && break; sleep 3; done
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "nte-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
